name: Backend CI

on:
    workflow_call:
        inputs:
            bun-version:
                description: "Bun version to install"
                required: true
                type: string
                default: "1.3.14"
            enable-mongo:
                description: "Spin up MongoDB service container"
                required: true
                type: boolean
        secrets:
            MONGO_URI:
                required: true

jobs:
    test-and-build:
        runs-on: ubuntu-latest

        services:
            mongo:
                image: mongo:latest
                ports:
                    - 27017:27017

        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Setup Environment
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ inputs.bun-version }}

            - name: Install Dependencies
              working-directory: ./api
              run: bun install --frozen-lockfile

            - name: TypeScript Checks
              working-directory: ./api
              run: bun run tsc --noEmit

            # TODO:
            # - name: Lint Check
            #   run: bun run lint:check

            # - name: Unit-Tests
            #   env:
            #       MONGO_URI: mongodb://localhost:27017/lilify_test
            #   run: bun test

            - name: Build Docker Image
              run: docker build -t lilify ./api
