name: Lint
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v5
      # Setup Bun Environment
      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun
      # Install Dependencies
      - name: Install Dependencies
        uses: ./.github/actions/install-deps
        with:
          working-directory: ./
      # Lint Check
      - name: Lint Check
        run: bunx biome ci .
