services:
  # Mongo Database
  mongo:
    image: mongo:latest
    container_name: lilify-db
    ports:
      - "27017:27017"
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db

  # Mongo Express UI
  mongo-ui:
    image: mongo-express:latest
    container_name: lilify-db-ui
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    depends_on:
      - mongo

  # Redis Cache
  redis:
    image: redis/redis-stack:latest
    container_name: lilify-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data/cache

  # Express API
  api:
    build:
      context: .
      dockerfile: ./packages/api/Dockerfile
      target: development
    develop:
      watch:
        # Frontend
        - path: ./packages/api
          action: sync
          target: /app/packages/api
          ignore:
            - node_modules/
        # Shared
        - path: ./packages/shared
          action: sync
          target: /app/packages/shared
          ignore:
            - node_modules/
        # Rebuild on package.json change
        - path: ./packages/api/package.json
          target: /app/packages/api/package.json
          action: rebuild
    container_name: lilify-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - redis

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: ./packages/frontend/Dockerfile
      target: development
    develop:
      watch:
        # Frontend
        - path: ./packages/frontend
          action: sync
          target: /app/packages/frontend
          ignore:
            - node_modules/
        # Shared
        - path: ./packages/shared
          action: sync
          target: /app/packages/shared
          ignore:
            - node_modules/
        # Rebuild on package.json change
        - path: ./packages/frontend/package.json
          target: /app/package.json
          action: rebuild
    container_name: lilify-frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mongo-data:
  redis-data:
